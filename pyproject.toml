[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passport-filter"
version = "0.1.0"
description = "Filtro determinista que simula el estilo de fotos de pasaporte ruso mal fotocopiadas/escaneadas"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
camera = ["opencv-python>=4.8,<5"]
gui = ["flask>=3.0", "pywebview>=5.0"]
dev = ["pytest>=8.0"]

[project.scripts]
passport-filter = "passport_filter.cli:main"
passport-filter-gui = "passport_filter.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
passport_filter = ["assets/patterns/*.png", "gui/templates/*.html", "gui/static/*"]
